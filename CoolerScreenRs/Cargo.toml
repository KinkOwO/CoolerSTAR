[package]
name = "cooler-screen"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "CoolerSTAR"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
ab_glyph = "0.2"
# 只是为了从 eframe 的 CreationContext 里把窗口句柄掏出来（见 main.rs 的 hide_window）
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }